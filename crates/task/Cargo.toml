[package]
name = "task"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[[bin]]
name = "task"
path = "src/main.rs"

[dependencies]
taskcore = { path = "../taskcore" }
clap = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

# `--update`: fetch a GitHub release over HTTPS, check it against the sha256
# published beside it, and extract the binary from the release archive. anyhow
# only here, at the application boundary the guidelines allow it at.
anyhow = { workspace = true }
flate2 = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }

[lints]
workspace = true
