name: Quality

# Reusable fmt/clippy/test/audit checks, called by ci.yml (push/PR) and release.yml
# (tag gate) so a release build is gated on the exact same checks as ordinary CI,
# rather than relying on a separate ci.yml run happening to have passed for that tag.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in rust-toolchain.toml (channel + clippy,
      # rustfmt components) via the rustup that ships on the runner.
      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Reads the committed Cargo.lock directly (no workspace compile needed).
      # .cargo/audit.toml, if present, holds the RUSTSEC ignore list — see audit.sh,
      # which runs this same check locally via the devcontainer.
      - name: cargo audit
        run: cargo audit --deny warnings
