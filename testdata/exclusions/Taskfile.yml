version: '3'

# Each task's sources are read with `--status --json`; links are made by the
# test (crates/task/tests/exclusions.rs).
tasks:
  # `build/again` links back to `build`: `build/**` still excludes the file
  # reached through it.
  through-loop:
    sources:
      - build/again/*.o
      - src/*.txt
      - exclude: build/**
    cmds: ['true']

  # A trailing `/` matches only a directory. A relative pattern loses it
  # when joined to the task directory.
  slash-absolute:
    sources:
      - input.txt
      - exclude: '{{.TASKFILE_DIR}}/input.txt/'
    cmds: ['true']

  slash-relative:
    sources:
      - input.txt
      - src/a.txt
      - exclude: input.txt/
    cmds: ['true']

  # `gen/**` matching nothing below matches `gen` only as a directory.
  tree-of-a-file:
    sources:
      - gen
      - exclude: gen/**
    cmds: ['true']

  # `link` is made a symlink to `src`: as a directory it is excluded.
  link-to-excluded:
    sources:
      - '*'
      - exclude: link/**
    cmds: ['true']

  # Exclusions match dot entries; includes skip them unless named.
  dot-entries:
    sources:
      - '**/*.o'
      - target/.*/*.o
      - src/.env
      - exclude: target/**
    cmds: ['true']

  # `exclude: src/.*` removes `src/.env`, which the shell rule hides even
  # from `.*`.
  dot-wildcard:
    sources:
      - src/.e*
      - src/a.txt
      - exclude: src/.*
    cmds: ['true']

  # No include names a dot entry an exclusion matches: the checksum is the
  # one 4.9.0 computed.
  no-contradiction:
    sources:
      - 'fixture/**/*'
      - fixture/src/web/.yarnrc.yml
      - exclude: 'fixture/**/node_modules/**'
      - exclude: 'fixture/src/.cache/**'
    cmds: ['true']
