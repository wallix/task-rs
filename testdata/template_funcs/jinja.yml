version: '3'
templater: jinja

# A file written natively in Jinja keeps standard Jinja meaning: the sprig
# helpers are reachable as functions, but the filters of those names are
# minijinja's own — except `trunc` and `regexReplaceAll`, which minijinja has no
# filter of, so Task registers subject-first ones.
vars:
  P: 'dir/fr.po'
  EMPTY: ''
  ZERO: 0

tasks:
  jinja:
    cmds:
      # Jinja's `default` substitutes only for an undefined value...
      - 'echo default={{ EMPTY | default("fallback") }}'
      - 'echo zero={{ ZERO | default(10) }}'
      - 'echo missing={{ MISSING | default("fallback") }}'
      # ...and its `title` lowercases the tail of each word.
      - 'echo title={{ "HELLO world" | title }}'
      # ...while the `boolean` argument gives sprig's reach over any empty
      # value, which is what a migrated Taskfile carries.
      - 'echo lax_default={{ EMPTY | default("fallback", true) }}'
      - 'echo lax_zero={{ ZERO | default(10, true) }}'
      # The sprig meaning of the others is still available in function position.
      - 'echo sprig_title={{ title("HELLO world") }}'
      - 'echo sprig_join={{ join(",", P) }}'
      # Task registers a subject-first filter for these two, so a Jinja
      # Taskfile needs neither sprig-ordered call.
      - 'echo trunc={{ P | trunc(3) }}'
      - 'echo regex={{ P | regexReplaceAll("[.]po$", ".mo") }}'
