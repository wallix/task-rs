version: '3'

# Each sprig helper is called in function position, where the subject is the
# last argument, and again after a pipe, where it is the first. The two
# spellings must render the same text — except `regexReplaceAll`, whose subject
# sprig takes in the middle, so the pipe means something else; see `pipes:`.
vars:
  P: 'dir/fr.po'
  EMPTY: ''
  MAJOR: '3'
  MINOR: '11'

tasks:
  funcs:
    cmds:
      - 'echo suffix={{trimSuffix ".po" .P}}'
      - 'echo prefix={{trimPrefix "dir/" .P}}'
      - 'echo split={{join "," (splitList "/" .P)}}'
      - 'echo has={{hasPrefix "dir/" .P}}{{hasSuffix ".mo" .P}}'
      - 'echo first={{first (splitList "/" .P)}}'
      - 'echo default={{default "fallback" .MISSING}}'
      - 'echo title={{title "hello wide world"}}'
      - 'echo trunc={{trunc 3 .P}}'
      - 'echo regex={{regexReplaceAll "[.]po$" .P ".mo"}}'

  pipes:
    cmds:
      - 'echo suffix={{.P | trimSuffix ".po"}}'
      - 'echo prefix={{.P | trimPrefix "dir/"}}'
      - 'echo split={{.P | splitList "/" | join ","}}'
      # The five that mean something else as a Jinja filter, after a pipe.
      # `default` fires on an empty value, not only a missing one, so the Go
      # and pipe spellings agree; it migrates to the builtin filter and the
      # other four to a call.
      - 'echo default={{.EMPTY | default "fallback"}}'
      - 'echo title={{"HELLO world" | title}}'
      - 'echo first={{.P | splitList "/" | first}}'
      - 'echo last={{.P | splitList "/" | last}}'
      - 'echo join={{.P | join ","}}'
      # `trunc` takes its subject last, so the pipe agrees with the call.
      - 'echo trunc={{.P | trunc 3}}'
      # `regexReplaceAll` takes it in the middle, so a pipe hands it the
      # replacement slot instead: it substitutes inside `.mo`, matching nothing.
      # Odd, but what Go renders, so the migrated file must keep the call.
      - 'echo regex={{.P | regexReplaceAll "[.]po$" ".mo"}}'

  # `printf` and `print` assemble a path out of several variables — the Go
  # builtins a Taskfile reaches for the most.
  printf:
    cmds:
      - 'echo dist={{printf "/usr/lib/python%s.%s/dist-packages" .MAJOR .MINOR}}'
      - 'echo ext={{printf "uid.cpython-%s%s.so" .MAJOR .MINOR}}'
      - 'echo pct={{printf "%d%%" 50}}'
      - 'echo print={{print (joinPath "dir" "key.pem")}}'
      - 'echo piped={{.P | printf "%s.mo"}}'
