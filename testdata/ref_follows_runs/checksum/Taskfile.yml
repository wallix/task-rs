version: '3'

vars:
  CACHE_DIR:
    sh: echo "$CACHE_DIR"

tasks:
  # CHECKSUM, rendered after the references resolved (a deferred command and
  # the cache block), covers the referenced task's sources too.
  pkg:
    sources:
      - task: lib
      - pkg.txt
    generates: [out/pkg.txt]
    cache:
      url: 'file://{{.CACHE_DIR}}/pkg-{{.CHECKSUM}}.zip'
    cmds:
      - defer: echo 'CHECKSUM={{.CHECKSUM}}'
      - mkdir -p out && cat lib/lib.txt pkg.txt > out/pkg.txt

  lib:
    dir: lib
    sources: [lib.txt]

  # A reference resolving to no sources leaves no CHECKSUM to render.
  empty-ref:
    sources: [{task: nothing}]
    cmds:
      - defer: echo 'CHECKSUM=[{{.CHECKSUM}}]'
      - 'true'

  nothing:
    cmds:
      - 'true'
