version: '3'

# The cache key 4.8.0 derived for a task without references, which names the
# lock on the (unreachable) registry.
tasks:
  cached:
    vars: {FLAVOR: plain}
    sources: [a.txt]
    generates: [out/c.txt]
    cache:
      vk: 127.0.0.1:9/repo
    cmds:
      - mkdir -p out && cat a.txt > out/c.txt
