version: '3'

tasks:
  probe:
    sources: [src/**]
    sandbox: true
    cmds:
      - cat src/a.txt

  sources-and-outputs:
    sources: [src/**]
    generates: [out/**/*]
    sandbox: true
    cmds:
      - mkdir -p out && cat src/a.txt > out/a.txt
      # src holds only sources, so the command may create and remove files in it
      - echo tmp > src/b.tmp && rm src/b.tmp

  fingerprinted-sources:
    sources:
      - glob: src/**/*
        fingerprint: src/a.txt
    sandbox: true
    cmds:
      - cat src/b.txt

  sources-of-another-task:
    sources:
      - task: secret-reader
    sandbox: true
    cmds:
      - cat secret/key

  secret-reader:
    sources: [secret/**]
    cmds:
      - cat secret/key

  read-outside-sources:
    sources: [src/**]
    sandbox: true
    cmds:
      - cat secret/key

  if-reads-outside-sources:
    sources: [src/**]
    sandbox: true
    cmds:
      - cmd: echo ran
        if: cat secret/key >/dev/null

  link-out-of-sources:
    sources: [src/**]
    generates: [out/**/*]
    sandbox: true
    cmds:
      - mkdir -p out && ln secret/key out/key && cat out/key

  reads-and-writes:
    sources: [src/**]
    sandbox:
      reads: [secret/**]
      writes: [mixed/cache]
    cmds:
      - cat secret/key
      - echo x > mixed/cache/x

  create-in-mixed-directory:
    sources: [src/**]
    sandbox: true
    cmds:
      - echo x > mixed/new

  # linked/pkg/config holds only a symlink to linked/rootfs/conf.txt: nothing
  # it holds is out of reach, so linked/pkg is writable.
  create-beside-a-symlink:
    sources: [linked/pkg/**]
    sandbox: true
    cmds:
      - mkdir linked/pkg/.pybuild
      - cat linked/pkg/config/conf

  # A writable directory reaches no further through a new link.
  hard-link-beside-a-symlink:
    sources: [linked/pkg/**]
    sandbox: true
    cmds:
      - ln linked/rootfs/other linked/pkg/config/h; cat linked/pkg/config/h

  symlink-beside-a-symlink:
    sources: [linked/pkg/**]
    sandbox: true
    cmds:
      - ln -s ../../rootfs/other linked/pkg/config/s && cat linked/pkg/config/s

  outer:
    sources: [src/**]
    sandbox: true
    cmds:
      - task: inner

  inner:
    cmds:
      - cat secret/key

  outer-process:
    sources: [src/**]
    sandbox: true
    cmds:
      - '"{{.TASK_EXE}}" inner-sandboxed'

  inner-sandboxed:
    sources: [src/a.txt]
    sandbox: true
    cmds:
      - cat src/a.txt

  with-unsandboxed-dep:
    sources: [src/**]
    sandbox: true
    deps: [inner]
    cmds:
      - cat src/a.txt

  list-ancestors:
    sources: [src/**]
    sandbox: true
    cmds:
      - ls .. > /dev/null && ls / > /dev/null

  create-in-ancestor:
    sources: [src/**]
    sandbox: true
    cmds:
      - touch "../$(basename "$PWD").escaped"

  generates-at-root:
    sources: [src/**]
    generates: [app]
    sandbox: true
    cmds:
      - echo app > app

  writes-at-root:
    sources: [src/**]
    sandbox:
      writes: ['.', '..']
    cmds:
      - cat secret/key

  tmpdir:
    sources: [src/**]
    sandbox: true
    env:
      TMPDIR: /overridden
    cmds:
      - echo "tmp=$TMPDIR"
      - echo x > "$TMPDIR/scratch" && cat "$TMPDIR/scratch"

  dotenv:
    sources: [src/**]
    dotenv: [mixed/vars.env]
    sandbox: true
    cmds:
      - cat mixed/vars.env

  if-false:
    sources: [src/**]
    sandbox: true
    cmds:
      - cmd: echo ran
        if: test -f src/missing

  swallowed-denial:
    sources: [src/**]
    sandbox: true
    cmds:
      - cat secret/key || true

  # The deferred command runs after the first one failed on its denial, and
  # is denied the same read again.
  repeated-denial:
    sources: [src/**]
    sandbox: true
    cmds:
      - defer: cat secret/key || true
      - cat secret/key || true

  nofollow:
    sources: [src/**]
    sandbox:
      writes: [scratch]
    cmds:
      - ln -sf ../secret/key scratch/lnk
      # The kernel refuses both before any permission check: no denial.
      - dd if=scratch/lnk iflag=nofollow of=/dev/null 2>/dev/null || echo refused
      - dd if=src/a.txt iflag=directory of=/dev/null 2>/dev/null || echo notdir
      # Not replacing an existing entry: EEXIST, whatever mv makes of it.
      - cp src/a.txt scratch/b && mv -n scratch/b mixed/keep; echo moved

  ignored-denial:
    sources: [src/**]
    sandbox: true
    cmds:
      - cmd: cat secret/key
        ignore_error: true
      - echo second

  # A nested task process, sandboxed in turn: out/ exists, from the outer
  # task's generates, so the inner one needs to create nothing.
  nested:
    sources: [src/**]
    generates: [out/**/*]
    sandbox: true
    cmds:
      - '"{{.TASK_EXE}}" nested-inner'

  # The same, but out/ is missing and the outer rules keep the inner task
  # from creating it.
  nested-missing-dir:
    sources: [src/**]
    sandbox: true
    cmds:
      - '"{{.TASK_EXE}}" nested-inner'

  nested-inner:
    sources: [src/**]
    generates: [out/**/*]
    sandbox: true
    cmds:
      - cat src/a.txt > out/nested.txt

  calls-task-with-dep:
    sources: [src/**]
    sandbox: true
    cmds:
      - task: with-dep

  with-dep:
    deps: [inner]
    cmds:
      - echo called

  generates-in-sources:
    sources: [src/a.txt]
    generates: [src/a.o]
    sandbox: true
    cmds:
      - cat src/a.txt > src/a.o

  reads-with-exclude:
    sources: [src/**]
    sandbox:
      reads:
        - secret/**
        - exclude: secret/key
    cmds:
      - cat secret/other
      - cat secret/key

  task-ignored-denial:
    sources: [src/**]
    sandbox: true
    ignore_error: true
    cmds:
      - cat secret/key

  deferred-denial:
    sources: [src/**]
    sandbox: true
    cmds:
      - defer: cat secret/key
      - echo ran

  # Two sandboxed tasks in one process: the inner one's wider sources do not
  # widen what the outer one allows.
  outer2:
    sources: [src/**]
    sandbox: true
    cmds:
      - task: inner2

  inner2:
    sources: [src/**, secret/**]
    sandbox: true
    cmds:
      - cat src/a.txt
      - cat secret/key

  call-ignored-denial:
    sources: [src/**]
    sandbox: true
    cmds:
      - task: inner
        ignore_error: true

  deferred-call-denial:
    sources: [src/**]
    sandbox: true
    cmds:
      - defer: {task: inner}
      - echo ran

  # `sandbox.writes` naming a task: the directories its generates write in
  # are writable. gen/ is missing, so without the entry the callee cannot
  # create it.
  gen:
    sources: [src/**]
    generates: [gen/out/*.txt]
    cmds:
      - mkdir -p gen/out && cat src/a.txt > gen/out/a.txt

  calls-gen:
    sources: [src/**]
    sandbox: true
    cmds:
      - task: gen
      - cat gen/out/a.txt

  calls-gen-writes:
    sources: [src/**]
    sandbox:
      writes: [{task: gen}]
    cmds:
      - task: gen
      - cat gen/out/a.txt

  # The callee is sandboxed too, and creates nothing itself.
  sandboxed-gen:
    sources: [src/**]
    generates: [sbx-gen/a.txt]
    sandbox: true
    cmds:
      - cat src/a.txt > sbx-gen/a.txt

  calls-sandboxed-gen-writes:
    sources: [src/**]
    sandbox:
      writes: [{task: sandboxed-gen}]
    cmds:
      - task: sandboxed-gen
      - cat sbx-gen/a.txt

  # A nested task process: out/ is missing, as for nested-missing-dir.
  nested-writes:
    sources: [src/**]
    sandbox:
      writes: [{task: nested-inner}]
    cmds:
      - '"{{.TASK_EXE}}" nested-inner'
      - cat out/nested.txt

  # The reference's vars pick the directory: mixed/ holds files the task may
  # not read, so only the named subdirectory is writable.
  gen-lang:
    sources: [src/**]
    generates: ['mixed/{{.LANG}}/*.txt']
    cmds:
      - mkdir -p mixed/{{.LANG}} && cat src/a.txt > mixed/{{.LANG}}/a.txt

  calls-gen-lang-writes:
    sources: [src/**]
    sandbox:
      writes: [{task: gen-lang, vars: {LANG: '{{.WRITES_LANG | default "fr"}}'}}]
    cmds:
      - task: gen-lang
        vars: {LANG: fr}
      - cat mixed/fr/a.txt

  # The referenced task's generates reference another task in turn.
  gen-wrapper:
    generates: [{task: gen}]

  calls-gen-transitive-writes:
    sources: [src/**]
    sandbox:
      writes: [{task: gen-wrapper}]
    cmds:
      - task: gen
      - cat gen/out/a.txt

  writes-unknown-task:
    sandbox:
      writes: [{task: no-such-task}]
    cmds:
      - echo never

  writes-empty-task-name:
    sandbox:
      writes: [{task: '{{.UNSET}}'}]
    cmds:
      - echo never

  # A cycle in the referenced task's own generates.
  writes-cycle:
    sandbox:
      writes: [{task: writes-cycle-gen}]
    cmds:
      - echo never

  writes-cycle-gen:
    generates: [{task: writes-cycle-wrapper}]

  writes-cycle-wrapper:
    generates: [{task: writes-cycle-gen}]

  # A task naming itself: its own generates, writable anyway.
  writes-itself:
    sources: [src/**]
    generates: [self/a.txt]
    sandbox:
      writes: [{task: writes-itself}]
    cmds:
      - cat src/a.txt > self/a.txt

  # Naming a task without generates grants nothing, with a warning.
  writes-nothing:
    sources: [src/**]
    sandbox:
      writes: [{task: probe}]
    cmds:
      - cat src/a.txt

  # Generates outside the root, under existing entries of its ancestors
  # (`/opt`, `/proc`): left alone, rather than created before the run.
  generates-outside-the-root:
    sources: [src/**]
    generates: ['/proc/sys/task-sandbox-test/*']
    sandbox:
      writes: [{task: gen-in-destdir}]
    cmds:
      - task: gen-in-destdir

  gen-in-destdir:
    generates: ['{{.DESTDIR}}/opt/task-sandbox-test/*']
    cmds:
      - echo ran

  # The referenced task writes next to the referrer's sources.
  writes-next-to-sources:
    sources: [src/**]
    sandbox:
      writes: [{task: gen-in-src}]
    cmds:
      - task: gen-in-src

  gen-in-src:
    generates: [src/gen.txt]
    cmds:
      - echo gen > src/gen.txt

  # Run once, then rerun with `sandbox.writes` naming a task: still up to date.
  fingerprinted:
    sources: [src/**]
    generates: [fp/a.txt]
    sandbox: true
    cmds:
      - mkdir -p fp && cat src/a.txt > fp/a.txt
