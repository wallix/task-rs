# ring (rustls' crypto backend) and zstd-sys compile C in their build scripts. The build
# image (.devcontainer/Dockerfile) carries two compilers: the host glibc gcc cargo needs
# for build scripts and proc-macros, and a musl cross gcc for the target. cc-rs would look
# for `musl-gcc`; name the cross tools it should use instead, and (below) make the same
# cross gcc rustc's linker driver so no musl link ever goes through the host cc.
#
# Both release architectures are declared. Native Linux builds need only the
# runner's cross tools.
#
# [target] linkers apply only to musl. [env] applies workspace-wide, but cc-rs reads
# CC_<triple>/AR_<triple> only for that target, leaving host `cargo build` and
# `cargo test` unaffected. Host builds for musl need these tools on PATH: use
# `nix develop ./.devcontainer/nix` or a container script.
[env]
CC_x86_64_unknown_linux_musl = "x86_64-unknown-linux-musl-cc"
AR_x86_64_unknown_linux_musl = "x86_64-unknown-linux-musl-ar"
CC_aarch64_unknown_linux_musl = "aarch64-unknown-linux-musl-cc"
AR_aarch64_unknown_linux_musl = "aarch64-unknown-linux-musl-ar"

[target.x86_64-unknown-linux-musl]
linker = "x86_64-unknown-linux-musl-cc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-unknown-linux-musl-cc"
